# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name dobsinskym.com www.dobsinskym.com;
    return 301 https://$host$request_uri;
}

# Serve HTTPS
server {
    listen 443 ssl;
    server_name dobsinskym.com www.dobsinskym.com;

    ssl_certificate /etc/letsencrypt/live/dobsinskym.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dobsinskym.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Download service for numeric paths
    location ~ ^/([0-9]+)$ {
        proxy_pass http://download-service:5050/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
