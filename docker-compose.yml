version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://user:password@db:5432/product_db
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - FLASK_DEBUG=false
      - API_BASE_URL=https://dobsinskym.com/api
      - DATABASE_URL_LOCAL=postgresql://user:password@0.0.0.0:5438/product_db
      - START_SCHEDULER_ON_STARTUP=False
      - STRIPE_SECRET_KEY=sk_test_51Qo5STPsseHpnxsDpzW2r1AHe6TOfSTVEUQCtNhBkNL5IVGEDYLkz7lnoVQgiYe7rNWnM6tgKhCe7t6zM3irnhcP00maPd4Wpa
      - STRIPE_PUBLIC_KEY=pk_test_51Qo5STPsseHpnxsDvD1Bz2MgnmEb9QAEHsNiRBo0gq9EH64cjspzUKDalNaXOKU9tMNLGVG7Ae4ZJEhBzjlwUJBL00fhsd4Cag
      - JWT_SECRET_
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/ping"]
      interval: 30s
      timeout: 60s
      retries: 3
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro  # Make sure your SSL certificates are in this directory
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'product_db'
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: 'email@email.com'
      PGADMIN_DEFAULT_PASSWORD: 'password'
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - db
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - app-network

volumes:
  postgres_data:
  pgadmin_data:
  grafana_data:
  prometheus:

networks:
  app-network:
    driver: bridge
